matrix:
  homeserverUrl: http://localhost:8008
  userId: '@quoted:localhost'
  accessToken: 'syt_XXXXXXXX_ZZZZZZZZZZZZZZZZZZZZ_ZZZZZZ'

# Command prefix – change if ..q conflicts with other bots
commandPrefix: ".."
commands:
  quote: "q"
  help: "help"

helpText: 'Reply with <b>..q</b> to any message to create a sticker! Use <b>..q 1</b> to include 1 next message, etc...'
welcomeText: 'Hello, I am <b>Quoted</b>, a bot for creating stickers of messages. See <b>..help</b> for help. Source code is available on <a href="https://github.com/Vadim-Khristenko/quoted-matrix">GitHub</a>.'

# Logging
logLevel: info  # debug | info | warn | error

# Rendering options
render:
  # Animated stickers / emoji -> animated output sticker (WebP)
  # Requires ffmpeg in PATH
  animatedStickers: true

  # Transparent background for generated stickers (Telegram style)
  transparentBackground: true

  # Make message bubbles transparent too? usually false
  transparentBubbles: false

  # Max sticker size in px
  stickerMaxSize: 512

  # Inline emoji size (Telegram custom emoji)
  emojiSize: 22

  # Animation limits (to avoid huge files)
  maxFrames: 60
  fps: 20

  # Full path to ffmpeg binary (if not in PATH).
  # Linux/Docker: ffmpeg  (installed via apt)
  # Windows: use forward slashes, e.g. "C:/ffmpeg/bin/ffmpeg.exe"
  # ffmpegPath: "ffmpeg"